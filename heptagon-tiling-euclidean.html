<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>칠각형 타일링 - 각도 조정</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            max-width: 1000px;
            width: 100%;
        }

        .canvas-wrapper {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        canvas {
            display: block;
            border-radius: 10px;
            cursor: move;
            max-width: 100%;
            height: auto;
        }

        canvas.dragging-vertex {
            cursor: crosshair;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-item {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-label {
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            flex: 1;
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .value-display {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 5px;
            font-weight: 600;
            min-width: 50px;
            text-align: center;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.active {
            background: white;
            color: #667eea;
        }

        .info-panel {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            text-align: center;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .info-label {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .info-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .instructions {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .instructions strong {
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔷 칠각형 타일링</h1>
        <div class="subtitle">각도 조정된 칠각형 - 드래그로 점 수정 가능</div>
    </div>

    <div class="container">
        <div class="canvas-wrapper">
            <canvas id="canvas" width="800" height="800"></canvas>
        </div>

        <div class="controls">
            <div class="control-item">
                <div class="control-label">레이어 깊이</div>
                <div class="control-content">
                    <input type="range" id="depth" min="0" max="5" value="2" step="1">
                    <div class="value-display" id="depth-value">2</div>
                </div>
            </div>

            <div class="control-item">
                <div class="control-label">줌 레벨</div>
                <div class="control-content">
                    <input type="range" id="zoom" min="0.3" max="3.0" value="1.0" step="0.1">
                    <div class="value-display" id="zoom-value">1.0</div>
                </div>
            </div>

            <div class="control-item">
                <div class="control-label">회전 각도</div>
                <div class="control-content">
                    <input type="range" id="rotation" min="0" max="360" value="0" step="5">
                    <div class="value-display" id="rotation-value">0°</div>
                </div>
            </div>

            <div class="control-item">
                <div class="control-label">표시 옵션</div>
                <div class="button-group">
                    <button id="toggle-fill" class="active">채우기</button>
                    <button id="toggle-edges" class="active">경계선</button>
                    <button id="toggle-vertices" class="active">꼭짓점</button>
                    <button id="toggle-edit-mode">편집 모드</button>
                </div>
            </div>
        </div>

        <div class="button-group" style="justify-content: center; margin-bottom: 20px;">
            <button id="reset">🔄 초기화</button>
            <button id="export">💾 이미지 저장</button>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <div class="info-label">총 타일 수</div>
                <div class="info-value" id="tile-count">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">현재 레이어</div>
                <div class="info-value" id="current-layer">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">편집 모드</div>
                <div class="info-value" id="edit-status">OFF</div>
            </div>
        </div>

        <div class="instructions">
            <strong>사용 방법:</strong><br>
            • 캔버스를 드래그하여 이동할 수 있습니다<br>
            • 편집 모드를 켜고 꼭짓점을 드래그하여 위치를 조정하세요<br>
            • 각 타일에서 특정 꼭짓점은 120° (3개 만나면 360°)<br>
            • 나머지 꼭짓점 각도는 총 900°가 되도록 자동 분배됩니다
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // 설정
        let config = {
            depth: 2,
            zoom: 1.0,
            rotation: 0,
            showFill: true,
            showEdges: true,
            showVertices: true,
            editMode: false,
            offsetX: 0,
            offsetY: 0
        };

        let isDragging = false;
        let draggedVertex = null;
        let lastX = 0, lastY = 0;
        let tiles = [];

        const width = canvas.width;
        const height = canvas.height;
        const centerX = width / 2;
        const centerY = height / 2;

        // 각도 조정된 칠각형 생성
        function createAdjustedHeptagon(cx, cy, size, rotation, vertexAngles = null) {
            // 기본 각도 배치: 하나는 120도, 나머지는 균등 분배
            if (!vertexAngles) {
                const remaining = 900 - 120; // 총 내각의 합 - 120도
                const otherAngle = remaining / 6; // 나머지 6개로 분배

                vertexAngles = [
                    120,        // 만나는 점 (3개가 만나면 360도)
                    otherAngle,
                    otherAngle,
                    otherAngle,
                    otherAngle,
                    otherAngle,
                    otherAngle
                ];
            }

            const vertices = [];
            let currentAngle = rotation;
            let currentX = cx + size;
            let currentY = cy;

            vertices.push({x: currentX, y: currentY});

            // 각 꼭짓점 각도를 사용하여 다음 점 계산
            for (let i = 0; i < 6; i++) {
                // 외각 = 180 - 내각
                const exteriorAngle = 180 - vertexAngles[i];
                currentAngle += exteriorAngle * Math.PI / 180;

                currentX += size * Math.cos(currentAngle);
                currentY += size * Math.sin(currentAngle);

                vertices.push({x: currentX, y: currentY});
            }

            return vertices;
        }

        // Edge-to-edge 타일링 생성
        function generateTiles(maxDepth) {
            tiles = [];
            const tileMap = new Map();

            const baseSize = 80;
            const rotationOffset = config.rotation * Math.PI / 180;

            // Layer 0: 중심 타일
            const centerTile = {
                vertices: createAdjustedHeptagon(centerX, centerY, baseSize, rotationOffset),
                depth: 0,
                color: '#FF6B6B',
                edges: []
            };

            for (let i = 0; i < 7; i++) {
                centerTile.edges.push({
                    v1: centerTile.vertices[i],
                    v2: centerTile.vertices[(i + 1) % 7],
                    used: false
                });
            }

            tiles.push(centerTile);
            tileMap.set(getTileId(centerTile.vertices), centerTile);

            if (maxDepth === 0) return;

            // Layer 1: 중심 타일의 각 변에 붙이기
            const layer1Tiles = createLayer1FromEdges(centerTile, baseSize);
            tiles.push(...layer1Tiles);
            layer1Tiles.forEach(t => tileMap.set(getTileId(t.vertices), t));

            if (maxDepth === 1) return;

            // Layer 2 이상
            for (let depth = 2; depth <= maxDepth; depth++) {
                const newTiles = expandFromEdges(tiles, tileMap, depth, baseSize);
                tiles.push(...newTiles);
                newTiles.forEach(t => tileMap.set(getTileId(t.vertices), t));
            }
        }

        // Layer 1 생성
        function createLayer1FromEdges(centerTile, baseSize) {
            const layer1 = [];
            const colors = ['#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7B731', '#5F27CD', '#00D2FF'];

            centerTile.edges.forEach((edge, edgeIdx) => {
                const newTile = createTileFromEdge(
                    edge.v1, edge.v2,
                    baseSize * 0.85,
                    1,
                    colors[edgeIdx % colors.length]
                );

                if (newTile) {
                    layer1.push(newTile);
                    edge.used = true;
                }
            });

            return layer1;
        }

        // 변을 공유하는 새 타일 생성
        function createTileFromEdge(sharedV1, sharedV2, size, depth, color) {
            const vertices = [];

            const edgeLength = Math.sqrt(
                (sharedV2.x - sharedV1.x) ** 2 +
                (sharedV2.y - sharedV1.y) ** 2
            );

            const edgeAngle = Math.atan2(sharedV2.y - sharedV1.y, sharedV2.x - sharedV1.x);

            // 각도 조정: 특정 점 120도, 나머지 균등 분배
            const vertexAngle1 = 120; // 공유 변 시작점
            const remaining = 900 - vertexAngle1;
            const otherAngle = remaining / 6;

            vertices.push({x: sharedV1.x, y: sharedV1.y});
            vertices.push({x: sharedV2.x, y: sharedV2.y});

            let currentAngle = edgeAngle;
            const angles = [vertexAngle1, otherAngle, otherAngle, otherAngle, otherAngle, otherAngle];

            for (let i = 0; i < 5; i++) {
                const exteriorAngle = 180 - angles[i];
                currentAngle += exteriorAngle * Math.PI / 180;

                const prevVertex = vertices[vertices.length - 1];
                vertices.push({
                    x: prevVertex.x + edgeLength * Math.cos(currentAngle),
                    y: prevVertex.y + edgeLength * Math.sin(currentAngle)
                });
            }

            const tile = {
                vertices: vertices,
                depth: depth,
                color: color,
                edges: []
            };

            for (let i = 0; i < 7; i++) {
                tile.edges.push({
                    v1: vertices[i],
                    v2: vertices[(i + 1) % 7],
                    used: (i === 0)
                });
            }

            return tile;
        }

        // 레이어 확장
        function expandFromEdges(existingTiles, tileMap, depth, baseSize) {
            const newTiles = [];
            const colors = ['#98D8C8', '#F7B731', '#5F27CD', '#00D2FF', '#FF6B6B', '#4ECDC4', '#45B7D1'];

            existingTiles.forEach((tile) => {
                if (!tile.edges) return;

                tile.edges.forEach((edge, edgeIdx) => {
                    if (edge.used) return;

                    const tileSize = baseSize * Math.pow(0.92, depth);

                    const newTile = createTileFromEdge(
                        edge.v1, edge.v2,
                        tileSize,
                        depth,
                        colors[(depth + edgeIdx) % colors.length]
                    );

                    if (newTile) {
                        const center = getTileCenter(newTile.vertices);

                        if (Math.abs(center.x - centerX) > width * 0.6 ||
                            Math.abs(center.y - centerY) > height * 0.6) {
                            return;
                        }

                        const tileId = getTileId(newTile.vertices);
                        if (!tileMap.has(tileId)) {
                            newTiles.push(newTile);
                            edge.used = true;
                        }
                    }
                });
            });

            return newTiles;
        }

        function getTileCenter(vertices) {
            let cx = 0, cy = 0;
            vertices.forEach(v => {
                cx += v.x;
                cy += v.y;
            });
            return {x: cx / vertices.length, y: cy / vertices.length};
        }

        function getTileId(vertices) {
            const center = getTileCenter(vertices);
            return `${center.x.toFixed(1)},${center.y.toFixed(1)}`;
        }

        // 화면 좌표 변환
        function toScreen(point) {
            return {
                x: (point.x - centerX) * config.zoom + centerX + config.offsetX,
                y: (point.y - centerY) * config.zoom + centerY + config.offsetY
            };
        }

        function fromScreen(screenX, screenY) {
            return {
                x: (screenX - config.offsetX - centerX) / config.zoom + centerX,
                y: (screenY - config.offsetY - centerY) / config.zoom + centerY
            };
        }

        // 렌더링
        function render() {
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(0, 0, width, height);

            tiles.forEach((tile) => {
                const color = tile.color;

                // 채우기
                if (config.showFill) {
                    ctx.beginPath();
                    const s0 = toScreen(tile.vertices[0]);
                    ctx.moveTo(s0.x, s0.y);
                    for (let i = 1; i < tile.vertices.length; i++) {
                        const s = toScreen(tile.vertices[i]);
                        ctx.lineTo(s.x, s.y);
                    }
                    ctx.closePath();
                    ctx.fillStyle = color + '60';
                    ctx.fill();
                }

                // 경계선
                if (config.showEdges) {
                    ctx.beginPath();
                    const s0 = toScreen(tile.vertices[0]);
                    ctx.moveTo(s0.x, s0.y);
                    for (let i = 1; i < tile.vertices.length; i++) {
                        const s = toScreen(tile.vertices[i]);
                        ctx.lineTo(s.x, s.y);
                    }
                    ctx.closePath();
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                // 꼭짓점
                if (config.showVertices) {
                    tile.vertices.forEach((v, idx) => {
                        const s = toScreen(v);
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, config.editMode ? 6 : 4, 0, 2 * Math.PI);
                        ctx.fillStyle = config.editMode ? '#ff6b6b' : '#2c3e50';
                        ctx.fill();
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    });
                }
            });

            // 통계 업데이트
            document.getElementById('tile-count').textContent = tiles.length;
            document.getElementById('current-layer').textContent = config.depth;
            document.getElementById('edit-status').textContent = config.editMode ? 'ON' : 'OFF';
        }

        // 꼭짓점 찾기
        function findVertexAt(screenX, screenY) {
            const threshold = 10;

            for (let tile of tiles) {
                for (let i = 0; i < tile.vertices.length; i++) {
                    const s = toScreen(tile.vertices[i]);
                    const dist = Math.sqrt((s.x - screenX) ** 2 + (s.y - screenY) ** 2);

                    if (dist < threshold) {
                        return {tile, vertexIndex: i};
                    }
                }
            }
            return null;
        }

        // 초기화
        function init() {
            generateTiles(config.depth);
            render();
        }

        // 이벤트 리스너
        document.getElementById('depth').addEventListener('input', (e) => {
            config.depth = parseInt(e.target.value);
            document.getElementById('depth-value').textContent = config.depth;
            generateTiles(config.depth);
            render();
        });

        document.getElementById('zoom').addEventListener('input', (e) => {
            config.zoom = parseFloat(e.target.value);
            document.getElementById('zoom-value').textContent = config.zoom.toFixed(1);
            render();
        });

        document.getElementById('rotation').addEventListener('input', (e) => {
            config.rotation = parseInt(e.target.value);
            document.getElementById('rotation-value').textContent = config.rotation + '°';
            generateTiles(config.depth);
            render();
        });

        document.getElementById('toggle-fill').addEventListener('click', (e) => {
            config.showFill = !config.showFill;
            e.target.classList.toggle('active');
            render();
        });

        document.getElementById('toggle-edges').addEventListener('click', (e) => {
            config.showEdges = !config.showEdges;
            e.target.classList.toggle('active');
            render();
        });

        document.getElementById('toggle-vertices').addEventListener('click', (e) => {
            config.showVertices = !config.showVertices;
            e.target.classList.toggle('active');
            render();
        });

        document.getElementById('toggle-edit-mode').addEventListener('click', (e) => {
            config.editMode = !config.editMode;
            e.target.classList.toggle('active');
            canvas.style.cursor = config.editMode ? 'crosshair' : 'move';
            render();
        });

        document.getElementById('reset').addEventListener('click', () => {
            config = {
                depth: 2,
                zoom: 1.0,
                rotation: 0,
                showFill: true,
                showEdges: true,
                showVertices: true,
                editMode: false,
                offsetX: 0,
                offsetY: 0
            };

            document.getElementById('depth').value = 2;
            document.getElementById('depth-value').textContent = '2';
            document.getElementById('zoom').value = 1.0;
            document.getElementById('zoom-value').textContent = '1.0';
            document.getElementById('rotation').value = 0;
            document.getElementById('rotation-value').textContent = '0°';

            document.getElementById('toggle-fill').classList.add('active');
            document.getElementById('toggle-edges').classList.add('active');
            document.getElementById('toggle-vertices').classList.add('active');
            document.getElementById('toggle-edit-mode').classList.remove('active');

            canvas.style.cursor = 'move';

            generateTiles(config.depth);
            render();
        });

        document.getElementById('export').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'heptagon-tiling-adjusted.png';
            link.href = canvas.toDataURL();
            link.click();
        });

        // 마우스 이벤트
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (config.editMode) {
                // 편집 모드: 꼭짓점 드래그
                draggedVertex = findVertexAt(mouseX, mouseY);
                if (draggedVertex) {
                    canvas.classList.add('dragging-vertex');
                }
            } else {
                // 일반 모드: 캔버스 드래그
                isDragging = true;
                lastX = e.clientX;
                lastY = e.clientY;
                canvas.style.cursor = 'grabbing';
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (draggedVertex) {
                // 꼭짓점 이동
                const worldPos = fromScreen(mouseX, mouseY);
                draggedVertex.tile.vertices[draggedVertex.vertexIndex].x = worldPos.x;
                draggedVertex.tile.vertices[draggedVertex.vertexIndex].y = worldPos.y;
                render();
            } else if (isDragging) {
                // 캔버스 이동
                config.offsetX += e.clientX - lastX;
                config.offsetY += e.clientY - lastY;
                lastX = e.clientX;
                lastY = e.clientY;
                render();
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            draggedVertex = null;
            canvas.style.cursor = config.editMode ? 'crosshair' : 'move';
            canvas.classList.remove('dragging-vertex');
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            draggedVertex = null;
            canvas.style.cursor = config.editMode ? 'crosshair' : 'move';
            canvas.classList.remove('dragging-vertex');
        });

        // 시작
        init();
    </script>
</body>
</html>
