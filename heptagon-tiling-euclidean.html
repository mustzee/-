<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>칠각형 타일링 - 유클리드 평면</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            max-width: 1000px;
            width: 100%;
        }

        .canvas-wrapper {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        canvas {
            display: block;
            border-radius: 10px;
            cursor: move;
            max-width: 100%;
            height: auto;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-item {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-label {
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            flex: 1;
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .value-display {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 5px;
            font-weight: 600;
            min-width: 50px;
            text-align: center;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.active {
            background: white;
            color: #667eea;
        }

        .info-panel {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            text-align: center;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .info-label {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .info-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .instructions {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .instructions strong {
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔷 칠각형 타일링</h1>
        <div class="subtitle">유클리드 평면 - 각도 조정된 칠각형 타일링</div>
    </div>

    <div class="container">
        <div class="canvas-wrapper">
            <canvas id="canvas" width="800" height="800"></canvas>
        </div>

        <div class="controls">
            <div class="control-item">
                <div class="control-label">레이어 깊이</div>
                <div class="control-content">
                    <input type="range" id="depth" min="0" max="5" value="2" step="1">
                    <div class="value-display" id="depth-value">2</div>
                </div>
            </div>

            <div class="control-item">
                <div class="control-label">줌 레벨</div>
                <div class="control-content">
                    <input type="range" id="zoom" min="0.3" max="3.0" value="1.0" step="0.1">
                    <div class="value-display" id="zoom-value">1.0</div>
                </div>
            </div>

            <div class="control-item">
                <div class="control-label">회전 각도</div>
                <div class="control-content">
                    <input type="range" id="rotation" min="0" max="360" value="0" step="5">
                    <div class="value-display" id="rotation-value">0°</div>
                </div>
            </div>

            <div class="control-item">
                <div class="control-label">표시 옵션</div>
                <div class="button-group">
                    <button id="toggle-fill" class="active">채우기</button>
                    <button id="toggle-edges" class="active">경계선</button>
                    <button id="toggle-vertices">꼭짓점</button>
                </div>
            </div>
        </div>

        <div class="button-group" style="justify-content: center; margin-bottom: 20px;">
            <button id="reset">🔄 초기화</button>
            <button id="export">💾 이미지 저장</button>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <div class="info-label">총 타일 수</div>
                <div class="info-value" id="tile-count">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">현재 레이어</div>
                <div class="info-value" id="current-layer">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">꼭짓점 수</div>
                <div class="info-value" id="vertex-count">0</div>
            </div>
        </div>

        <div class="instructions">
            <strong>사용 방법:</strong><br>
            • 캔버스를 드래그하여 이동할 수 있습니다<br>
            • 레이어 깊이를 조절하여 더 많은 타일을 생성하세요<br>
            • 각 꼭짓점에서 만나는 각의 합이 정확히 360도가 됩니다<br>
            • 유클리드 평면에서 빈틈없이 맞물리는 칠각형 타일링입니다
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // 설정
        let config = {
            depth: 2,
            zoom: 1.0,
            rotation: 0,
            showFill: true,
            showEdges: true,
            showVertices: false,
            offsetX: 0,
            offsetY: 0
        };

        let isDragging = false;
        let lastX = 0, lastY = 0;
        let tiles = [];

        const width = canvas.width;
        const height = canvas.height;
        const centerX = width / 2;
        const centerY = height / 2;

        // 칠각형 타일 클래스
        class HeptagonTile {
            constructor(x, y, size, rotation, type = 'center') {
                this.x = x;
                this.y = y;
                this.size = size;
                this.rotation = rotation;
                this.type = type;
                this.vertices = this.calculateVertices();
            }

            calculateVertices() {
                const vertices = [];

                // 타입에 따라 다른 각도 사용
                // 중심 타일: 정칠각형 (각도가 동일)
                // 주변 타일: 각도 조정 (꼭짓점에서 360도 만족)

                if (this.type === 'center') {
                    // 정칠각형
                    for (let i = 0; i < 7; i++) {
                        const angle = (2 * Math.PI * i / 7) + this.rotation;
                        const x = this.x + this.size * Math.cos(angle);
                        const y = this.y + this.size * Math.sin(angle);
                        vertices.push({x, y});
                    }
                } else {
                    // 조정된 칠각형
                    // 한 꼭짓점의 각도를 120도로 설정 (3개가 만나서 360도)
                    // 나머지 각도들을 조정

                    const angles = this.getAdjustedAngles();
                    let currentAngle = this.rotation;

                    vertices.push({x: this.x, y: this.y}); // 시작점

                    for (let i = 0; i < 7; i++) {
                        const sideLength = this.size;
                        currentAngle += angles[i];
                        const x = vertices[vertices.length - 1].x + sideLength * Math.cos(currentAngle);
                        const y = vertices[vertices.length - 1].y + sideLength * Math.sin(currentAngle);

                        if (i < 6) { // 마지막 점은 시작점으로 돌아가야 함
                            vertices.push({x, y});
                        }
                    }
                }

                return vertices;
            }

            getAdjustedAngles() {
                // 꼭짓점 각도 배열 (내각)
                // 총합 = (7-2) * 180 = 900도
                // 한 점에 3개가 만나려면 각각 120도

                const deg = Math.PI / 180;
                return [
                    120 * deg,  // 맞물리는 점
                    128.57 * deg,
                    128.57 * deg,
                    128.57 * deg,
                    128.57 * deg,
                    128.57 * deg,
                    137.15 * deg
                ];
            }
        }

        // Edge-to-edge 타일링 생성
        function generateTiles(maxDepth) {
            tiles = [];
            const tileMap = new Map(); // 중복 방지

            const baseSize = 80; // 중심 타일 크기
            const rotationOffset = config.rotation * Math.PI / 180;

            // Layer 0: 중심 타일 (더 큰 칠각형)
            const centerTile = {
                vertices: createCenterHeptagon(centerX, centerY, baseSize, rotationOffset),
                depth: 0,
                color: '#FF6B6B',
                edges: []
            };

            // 중심 타일의 변 정보 저장
            for (let i = 0; i < 7; i++) {
                centerTile.edges.push({
                    v1: centerTile.vertices[i],
                    v2: centerTile.vertices[(i + 1) % 7],
                    used: false
                });
            }

            tiles.push(centerTile);
            tileMap.set(getTileId(centerTile.vertices), centerTile);

            if (maxDepth === 0) return;

            // Layer 1: 중심 타일의 각 변에 붙이기
            const layer1Tiles = createLayer1FromEdges(centerTile, baseSize);
            tiles.push(...layer1Tiles);
            layer1Tiles.forEach(t => tileMap.set(getTileId(t.vertices), t));

            if (maxDepth === 1) return;

            // Layer 2 이상: 기존 타일들의 빈 변에 계속 붙이기
            for (let depth = 2; depth <= maxDepth; depth++) {
                const newTiles = expandFromEdges(tiles, tileMap, depth, baseSize);
                tiles.push(...newTiles);
                newTiles.forEach(t => tileMap.set(getTileId(t.vertices), t));
            }
        }

        // 중심 칠각형 생성
        function createCenterHeptagon(cx, cy, size, rotation) {
            const vertices = [];
            for (let i = 0; i < 7; i++) {
                const angle = (2 * Math.PI * i / 7) + rotation;
                vertices.push({
                    x: cx + size * Math.cos(angle),
                    y: cy + size * Math.sin(angle)
                });
            }
            return vertices;
        }

        // Layer 1: 중심 타일의 변을 공유하면서 생성
        function createLayer1FromEdges(centerTile, baseSize) {
            const layer1 = [];
            const colors = ['#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7B731', '#5F27CD', '#00D2FF'];

            centerTile.edges.forEach((edge, edgeIdx) => {
                // 변의 중점과 방향 계산
                const midX = (edge.v1.x + edge.v2.x) / 2;
                const midY = (edge.v1.y + edge.v2.y) / 2;

                // 변의 방향 벡터
                const dx = edge.v2.x - edge.v1.x;
                const dy = edge.v2.y - edge.v1.y;
                const edgeAngle = Math.atan2(dy, dx);

                // 변에 수직인 방향으로 새 타일 배치
                const outwardAngle = edgeAngle + Math.PI / 2;
                const distance = baseSize * 0.9; // 타일 간격

                const newCenterX = midX + distance * Math.cos(outwardAngle);
                const newCenterY = midY + distance * Math.sin(outwardAngle);

                // 새 타일 생성 (변을 공유하도록 회전)
                const newTile = createTileFromEdge(
                    edge.v1, edge.v2,
                    newCenterX, newCenterY,
                    baseSize * 0.85, // Layer 1은 약간 작게
                    1,
                    colors[edgeIdx % colors.length]
                );

                if (newTile) {
                    layer1.push(newTile);
                    edge.used = true;
                }
            });

            return layer1;
        }

        // 변을 공유하는 새 타일 생성
        function createTileFromEdge(sharedV1, sharedV2, centerX, centerY, size, depth, color) {
            const vertices = [];

            // 공유하는 변의 길이
            const edgeLength = Math.sqrt(
                (sharedV2.x - sharedV1.x) ** 2 +
                (sharedV2.y - sharedV1.y) ** 2
            );

            // 공유하는 변의 방향
            const edgeAngle = Math.atan2(sharedV2.y - sharedV1.y, sharedV2.x - sharedV1.x);

            // 칠각형의 내각 (약 128.57도)
            const interiorAngle = (5 * Math.PI) / 7; // (7-2)*180/7 in radians

            // 첫 번째 점 (공유 변의 시작)
            vertices.push({x: sharedV1.x, y: sharedV1.y});

            // 두 번째 점 (공유 변의 끝)
            vertices.push({x: sharedV2.x, y: sharedV2.y});

            // 나머지 5개 점을 순차적으로 생성
            let currentAngle = edgeAngle; // 현재 방향

            for (let i = 2; i < 7; i++) {
                // 다음 변의 방향 = 현재 방향 + (180도 - 내각)
                currentAngle += Math.PI - interiorAngle;

                // 이전 점에서 edgeLength만큼 떨어진 다음 점
                const prevVertex = vertices[vertices.length - 1];
                vertices.push({
                    x: prevVertex.x + edgeLength * Math.cos(currentAngle),
                    y: prevVertex.y + edgeLength * Math.sin(currentAngle)
                });
            }

            const tile = {
                vertices: vertices,
                depth: depth,
                color: color,
                edges: []
            };

            // 변 정보 저장
            for (let i = 0; i < 7; i++) {
                tile.edges.push({
                    v1: vertices[i],
                    v2: vertices[(i + 1) % 7],
                    used: (i === 0) // 첫 번째 변은 이미 사용됨
                });
            }

            return tile;
        }

        // 기존 타일들의 빈 변에서 확장
        function expandFromEdges(existingTiles, tileMap, depth, baseSize) {
            const newTiles = [];
            const colors = ['#98D8C8', '#F7B731', '#5F27CD', '#00D2FF', '#FF6B6B', '#4ECDC4', '#45B7D1'];

            // 이전 레이어들의 타일 중 빈 변이 있는 것 찾기
            existingTiles.forEach((tile, tileIdx) => {
                if (!tile.edges) return;

                tile.edges.forEach((edge, edgeIdx) => {
                    if (edge.used) return;

                    // 변의 중점과 방향
                    const midX = (edge.v1.x + edge.v2.x) / 2;
                    const midY = (edge.v1.y + edge.v2.y) / 2;

                    const dx = edge.v2.x - edge.v1.x;
                    const dy = edge.v2.y - edge.v1.y;
                    const edgeAngle = Math.atan2(dy, dx);

                    // 변에 수직 방향
                    const outwardAngle = edgeAngle + Math.PI / 2;
                    const tileSize = baseSize * Math.pow(0.92, depth); // 레이어마다 조금씩 작게
                    const distance = tileSize * 0.9;

                    const newCenterX = midX + distance * Math.cos(outwardAngle);
                    const newCenterY = midY + distance * Math.sin(outwardAngle);

                    // 화면 범위 체크
                    if (Math.abs(newCenterX - centerX) > width * 0.6 ||
                        Math.abs(newCenterY - centerY) > height * 0.6) {
                        return;
                    }

                    // 새 타일 생성
                    const newTile = createTileFromEdge(
                        edge.v1, edge.v2,
                        newCenterX, newCenterY,
                        tileSize,
                        depth,
                        colors[(depth + edgeIdx) % colors.length]
                    );

                    if (newTile) {
                        // 중복 체크
                        const tileId = getTileId(newTile.vertices);
                        if (!tileMap.has(tileId)) {
                            newTiles.push(newTile);
                            edge.used = true;
                        }
                    }
                });
            });

            return newTiles;
        }

        // 타일 ID 생성 (중복 방지)
        function getTileId(vertices) {
            let cx = 0, cy = 0;
            vertices.forEach(v => {
                cx += v.x;
                cy += v.y;
            });
            return `${(cx / vertices.length).toFixed(1)},${(cy / vertices.length).toFixed(1)}`;
        }

        // 화면 좌표 변환
        function toScreen(point) {
            return {
                x: (point.x - centerX) * config.zoom + centerX + config.offsetX,
                y: (point.y - centerY) * config.zoom + centerY + config.offsetY
            };
        }

        // 타일 색상
        const layerColors = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A',
            '#98D8C8', '#F7B731', '#5F27CD', '#00D2FF'
        ];

        // 렌더링
        function render() {
            // 배경
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(0, 0, width, height);

            // 타일 그리기
            let uniqueVertices = new Set();

            tiles.forEach((tile) => {
                const color = tile.color || layerColors[tile.depth % layerColors.length];

                // 채우기
                if (config.showFill) {
                    ctx.beginPath();
                    const s0 = toScreen(tile.vertices[0]);
                    ctx.moveTo(s0.x, s0.y);
                    for (let i = 1; i < tile.vertices.length; i++) {
                        const s = toScreen(tile.vertices[i]);
                        ctx.lineTo(s.x, s.y);
                    }
                    ctx.closePath();
                    ctx.fillStyle = color + '60';
                    ctx.fill();
                }

                // 경계선
                if (config.showEdges) {
                    ctx.beginPath();
                    const s0 = toScreen(tile.vertices[0]);
                    ctx.moveTo(s0.x, s0.y);
                    for (let i = 1; i < tile.vertices.length; i++) {
                        const s = toScreen(tile.vertices[i]);
                        ctx.lineTo(s.x, s.y);
                    }
                    ctx.closePath();
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                // 꼭짓점
                if (config.showVertices) {
                    tile.vertices.forEach(v => {
                        const vid = `${v.x.toFixed(1)},${v.y.toFixed(1)}`;
                        uniqueVertices.add(vid);

                        const s = toScreen(v);
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, 4, 0, 2 * Math.PI);
                        ctx.fillStyle = '#2c3e50';
                        ctx.fill();
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    });
                }
            });

            // 통계 업데이트
            document.getElementById('tile-count').textContent = tiles.length;
            document.getElementById('current-layer').textContent = config.depth;
            document.getElementById('vertex-count').textContent = uniqueVertices.size;
        }

        // 초기화
        function init() {
            generateTiles(config.depth);
            render();
        }

        // 컨트롤 이벤트
        document.getElementById('depth').addEventListener('input', (e) => {
            config.depth = parseInt(e.target.value);
            document.getElementById('depth-value').textContent = config.depth;
            generateTiles(config.depth);
            render();
        });

        document.getElementById('zoom').addEventListener('input', (e) => {
            config.zoom = parseFloat(e.target.value);
            document.getElementById('zoom-value').textContent = config.zoom.toFixed(1);
            render();
        });

        document.getElementById('rotation').addEventListener('input', (e) => {
            config.rotation = parseInt(e.target.value);
            document.getElementById('rotation-value').textContent = config.rotation + '°';
            generateTiles(config.depth);
            render();
        });

        document.getElementById('toggle-fill').addEventListener('click', (e) => {
            config.showFill = !config.showFill;
            e.target.classList.toggle('active');
            render();
        });

        document.getElementById('toggle-edges').addEventListener('click', (e) => {
            config.showEdges = !config.showEdges;
            e.target.classList.toggle('active');
            render();
        });

        document.getElementById('toggle-vertices').addEventListener('click', (e) => {
            config.showVertices = !config.showVertices;
            e.target.classList.toggle('active');
            render();
        });

        document.getElementById('reset').addEventListener('click', () => {
            config = {
                depth: 2,
                zoom: 1.0,
                rotation: 0,
                showFill: true,
                showEdges: true,
                showVertices: false,
                offsetX: 0,
                offsetY: 0
            };

            document.getElementById('depth').value = 2;
            document.getElementById('depth-value').textContent = '2';
            document.getElementById('zoom').value = 1.0;
            document.getElementById('zoom-value').textContent = '1.0';
            document.getElementById('rotation').value = 0;
            document.getElementById('rotation-value').textContent = '0°';

            document.getElementById('toggle-fill').classList.add('active');
            document.getElementById('toggle-edges').classList.add('active');
            document.getElementById('toggle-vertices').classList.remove('active');

            generateTiles(config.depth);
            render();
        });

        document.getElementById('export').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'heptagon-tiling-euclidean.png';
            link.href = canvas.toDataURL();
            link.click();
        });

        // 마우스 드래그
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
            canvas.style.cursor = 'grabbing';
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                config.offsetX += e.clientX - lastX;
                config.offsetY += e.clientY - lastY;
                lastX = e.clientX;
                lastY = e.clientY;
                render();
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            canvas.style.cursor = 'move';
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            canvas.style.cursor = 'move';
        });

        // 터치 지원
        let lastTouchX = 0, lastTouchY = 0;

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            lastTouchX = touch.clientX;
            lastTouchY = touch.clientY;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            config.offsetX += touch.clientX - lastTouchX;
            config.offsetY += touch.clientY - lastTouchY;
            lastTouchX = touch.clientX;
            lastTouchY = touch.clientY;
            render();
        });

        // 시작
        init();
    </script>
</body>
</html>
