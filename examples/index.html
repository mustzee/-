<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order-3 Heptagonal Tiling - Poincaré Disk Model</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1a1a2e;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1 {
            margin-bottom: 10px;
            color: #00ff88;
        }

        .info {
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            color: #aaa;
        }

        #canvas {
            border: 2px solid #00ff88;
            border-radius: 50%;
            background: #0f0f1e;
            cursor: move;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            padding: 10px 20px;
            background: #00ff88;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: #1a1a2e;
            transition: background 0.3s;
        }

        button:hover {
            background: #00cc6a;
        }

        label {
            color: #aaa;
        }

        input[type="range"] {
            width: 150px;
        }

        .stats {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>Order-3 Heptagonal Tiling {7,3}</h1>
    <div class="info">
        Poincaré disk 모델에서의 쌍곡 기하학 시각화<br>
        각 꼭짓점에 3개의 정칠각형이 만나는 쌍곡 타일링
    </div>

    <canvas id="canvas" width="800" height="800"></canvas>

    <div class="controls">
        <button id="reset">Reset View</button>
        <label>
            Depth:
            <input type="range" id="depth" min="1" max="6" value="4" step="1">
            <span id="depthValue">4</span>
        </label>
        <label>
            <input type="checkbox" id="showEdges" checked>
            Show Edges
        </label>
        <label>
            <input type="checkbox" id="colorMode" checked>
            Color Tiles
        </label>
    </div>

    <div class="stats" id="stats"></div>

    <script src="hyperbolic.js"></script>
</body>
</html>
